name: safe_json_cast
description: >-
  Typed casts for decoded JSON that fail loudly and name the field, so a
  malformed payload surfaces at the parse site instead of deep in the UI.
version: 1.0.0
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/safe_json_cast
issue_tracker: https://github.com/CtrlAltDevelop/safe_json_cast/issues

topics:
  - json
  - parsing
  - serialization
  - validation
  - casting

# No `flutter:` constraint on purpose: the package is pure Dart, and declaring
# one would make the Flutter SDK mandatory for server and CLI consumers.
# Flutter 3.47.0 ships Dart 3.13.0, so the SDK bound below covers it.
environment:
  sdk: ^3.13.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
